<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 790" width="1260" height="790" role="img">
<title>配置命令通道 · 端到端通路</title>
<desc>命令帧从对端主机经 CMAC、IPv4、UDP 解封装后进入 UDP 内部命令档（demux 索引 0），经 512 拍 FIFO 送 cfg_cmd_top 解析，应答再经 UDP 命令档（TX 索引 N）封装回送主机；准入按请求的目的 IP 与该口 set0 本机 IP 比较。</desc>

<rect x="0" y="0" width="1260" height="790" fill="#FFFFFF"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text x="26" y="38" font-family="Helvetica,Arial,sans-serif" font-size="21" font-weight="600" fill="#111111">配置命令通道 · 端到端通路</text>
<text x="26" y="62" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#5F5E5A">UDP 内部命令档（demux 索引 0）｜ 单口绑定 CFG_CMD_PORT_SEL ｜ 侧带 241 bit 进 / 108 bit 出 ｜ 准入按请求的目的 IP</text>

<!-- ================= ① 接收方向 ================= -->
<rect x="14" y="84" width="1232" height="172" rx="12" fill="#FAFAF8" stroke="#D3D1C7" stroke-width="1"/>
<circle cx="46" cy="113" r="5" fill="#185FA5"/>
<text x="60" y="118" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#111111">接收方向 · 命令帧</text>
<text x="1220" y="117" text-anchor="end" font-family="Consolas,Menlo,monospace" font-size="11.5" fill="#444441">s_axis_cmd_*  ·  512 bit + 标准 UDP RX 侧带 241 bit</text>

<rect x="40" y="146" width="170" height="64" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1.2"/>
<text x="125" y="171" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#2C2C2A">对端主机</text>
<text x="125" y="190" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="10" fill="#5F5E5A">UDP dst 0xC0DE</text>

<path d="M210 178 H242" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ar)"/>

<rect x="246" y="146" width="210" height="64" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1.2"/>
<text x="351" y="171" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#2C2C2A">CMAC → IPv4 → UDP</text>
<text x="351" y="190" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#5F5E5A">剥头，载荷按 total_length 裁 keep</text>

<path d="M456 178 H488" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ar)"/>

<rect x="492" y="146" width="210" height="64" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
<text x="597" y="171" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#04342C">UDP 命令档</text>
<text x="597" y="190" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#5F5E5A">demux 索引 0 · 优先于用户档</text>

<path d="M702 178 H734" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ar)"/>

<rect x="738" y="146" width="160" height="64" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
<text x="818" y="171" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="11.5" fill="#042C53">axis_fifo_sync</text>
<text x="818" y="190" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#5F5E5A">512 拍 · block RAM</text>

<path d="M898 178 H930" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ar)"/>

<rect x="934" y="146" width="286" height="64" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
<text x="1077" y="171" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#26215C">cfg_cmd_top</text>
<text x="1077" y="190" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#5F5E5A">准入判定 + TLV 解析 + 应答组帧</text>

<text x="40" y="236" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#5F5E5A">命令档区间 = {0xC0DE, 0xC0DE}（只命中该端口）；非选中口的命令档区间置 32'h0000_FFFF（low &gt; high，永不命中）｜ 边界总线 udp_axis_m* 的通道索引不变</text>

<!-- ================= ② cfg_cmd_top 内部 ================= -->
<rect x="14" y="272" width="1232" height="298" rx="12" fill="#FAFAF8" stroke="#D3D1C7" stroke-width="1"/>
<circle cx="46" cy="301" r="5" fill="#0F6E56"/>
<text x="60" y="306" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#111111">cfg_cmd_top 内部</text>
<text x="1220" y="305" text-anchor="end" font-family="Consolas,Menlo,monospace" font-size="11.5" fill="#444441">cfg_cmd_rx → cfg_demux → 三路 → axis_n_to_1</text>

<rect x="40" y="346" width="170" height="52" rx="7" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
<text x="125" y="368" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="11.5" fill="#042C53">cfg_cmd_rx</text>
<text x="125" y="386" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#5F5E5A">逐根 TLV 入 FIFO</text>

<path d="M210 372 H236" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ar)"/>

<rect x="240" y="346" width="170" height="52" rx="7" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
<text x="325" y="368" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="11.5" fill="#042C53">cfg_demux</text>
<text x="325" y="386" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#5F5E5A">校验 + 三路分流</text>

<path d="M410 372 H430" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ar)"/>

<rect x="434" y="296" width="180" height="156" rx="8" fill="none" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 3"/>
<rect x="446" y="306" width="156" height="42" rx="7" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
<text x="524" y="332" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="11.5" fill="#04342C">cfg_set</text>
<rect x="446" y="352" width="156" height="42" rx="7" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
<text x="524" y="378" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="11.5" fill="#042C53">cfg_get</text>
<rect x="446" y="398" width="156" height="42" rx="7" fill="#FBEAF0" stroke="#993556" stroke-width="1.2"/>
<text x="524" y="424" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="11.5" fill="#4B1528">cfg_error</text>

<path d="M614 373 H686" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="690" y="352" width="150" height="42" rx="7" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
<text x="765" y="378" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="11.5" fill="#26215C">axis_n_to_1</text>

<path d="M840 373 H876" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="880" y="352" width="180" height="42" rx="7" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
<text x="970" y="378" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="11.5" fill="#26215C">m_axis_* → TX</text>

<path d="M524 452 V488" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-start="url(#ar)" marker-end="url(#ar)"/>
<rect x="404" y="492" width="240" height="44" rx="7" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.2"/>
<text x="524" y="519" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="11.5" fill="#412402">cfg_reg_bank</text>

<rect x="140" y="492" width="200" height="44" rx="7" fill="#F1EFE8" stroke="#888780" stroke-width="1.2"/>
<text x="240" y="512" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#2C2C2A">stat_* 只读状态</text>
<text x="240" y="528" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#5F5E5A">link / arp / icmp / tx_idle / tx_active</text>
<path d="M340 514 H400" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ar)"/>

<rect x="700" y="492" width="190" height="44" rx="7" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
<text x="795" y="519" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="11.5" fill="#04342C">cfg_* 数据面</text>
<path d="M644 514 H696" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ar)"/>

<text x="920" y="500" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#5F5E5A">写路径：SET → reg_bank</text>
<text x="920" y="520" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#5F5E5A">读路径：GET ← reg_bank（1 拍后有效）</text>
<text x="920" y="540" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#5F5E5A">cfg_* 全部走运行期通路，无编译期绑定</text>

<text x="40" y="558" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#5F5E5A">准入：请求的目的 IP 必须等于该口 set0 的本机 IP（cfg_local_ip[CMD_PORT_SEL]），否则整帧静默丢弃、不产生任何应答</text>

<!-- ================= ③ 发送方向 ================= -->
<rect x="14" y="586" width="1232" height="176" rx="12" fill="#FAFAF8" stroke="#D3D1C7" stroke-width="1"/>
<circle cx="46" cy="615" r="5" fill="#854F0B"/>
<text x="60" y="620" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#111111">发送方向 · 应答帧</text>
<text x="1220" y="619" text-anchor="end" font-family="Consolas,Menlo,monospace" font-size="11.5" fill="#444441">m_axis_udp_usr  ·  标准 UDP TX 侧带 108 bit</text>

<rect x="40" y="648" width="200" height="64" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
<text x="140" y="673" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="11.5" fill="#26215C">m_axis_udp_usr</text>
<text x="140" y="692" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#5F5E5A">四元组互换 · ttl = 64</text>

<path d="M240 680 H272" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ar)"/>

<rect x="276" y="648" width="220" height="64" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
<text x="386" y="673" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#04342C">UDP 命令档 TX</text>
<text x="386" y="692" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#5F5E5A">TX 入口索引 N（最后一路）</text>

<path d="M496 680 H528" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ar)"/>

<rect x="532" y="648" width="230" height="64" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1.2"/>
<text x="647" y="673" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#2C2C2A">UDP → IPv4 → CMAC</text>
<text x="647" y="692" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#5F5E5A">目的 MAC 由 ARP 解析</text>

<path d="M762 680 H794" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ar)"/>

<rect x="798" y="648" width="170" height="64" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1.2"/>
<text x="883" y="673" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#2C2C2A">对端主机</text>
<text x="883" y="692" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#5F5E5A">回请求的源 IP / 源端口</text>

<text x="986" y="666" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#5F5E5A">优先级取 ITEM 0x34，默认 9</text>
<text x="986" y="686" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#5F5E5A">首包可能因 ARP 未解析被丢弃</text>
<text x="986" y="706" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#5F5E5A">⇒ 上位机对超时命令应重发</text>
</svg>
