<svg xmlns="http://www.w3.org/2000/svg" width="1092" height="197" viewBox="0 0 1092 197" id="cfg_cmd_rsp-root" role="img" aria-labelledby="cfg_cmd_rsp-title cfg_cmd_rsp-desc">
  <title id="cfg_cmd_rsp-title">配置报文</title>
  <desc id="cfg_cmd_rsp-desc">配置应答的 UDP 载荷固定为 23 字节，图中列出七个字段的字节偏移。</desc>
  <style>
    #cfg_cmd_rsp-root text {
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", system-ui, sans-serif;
      font-weight: 400;
      fill: #152942;
    }
    #cfg_cmd_rsp-root .title { font-size: 28px; font-weight: 600; }
    #cfg_cmd_rsp-root .field-label { font-size: 18px; text-anchor: middle; }
    #cfg_cmd_rsp-root .note { font-size: 16px; fill: #465b73; }
    #cfg_cmd_rsp-root .offset {
      font-family: Consolas, "SFMono-Regular", "Liberation Mono", monospace;
      font-size: 15px;
      text-anchor: middle;
      fill: #465b73;
    }
    #cfg_cmd_rsp-root .field { fill: #f3f6fa; stroke: #b8c7d6; }
    #cfg_cmd_rsp-root .op-field { fill: #e8f2fe; stroke: #9bb7d5; }
  </style>

  <rect width="1092" height="197" fill="#ffffff"/>
  <text x="40" y="49" class="title">配置报文</text>
  <g aria-label="应答字段">
    <g data-field="标识 19 31" data-range="0–1">
      <rect x="40" y="68" width="128" height="68" class="field"/>
      <text x="104" y="93" class="offset">0–1</text>
      <text x="104" y="117" class="field-label">标识 19 31</text>
    </g>
    <g data-field="序号 + 操作码" data-range="2">
      <rect x="168" y="68" width="180" height="68" class="field op-field"/>
      <text x="258" y="93" class="offset">2</text>
      <text x="258" y="117" class="field-label">序号 + 操作码</text>
    </g>
    <g data-field="状态码" data-range="3">
      <rect x="348" y="68" width="112" height="68" class="field"/>
      <text x="404" y="93" class="offset">3</text>
      <text x="404" y="117" class="field-label">状态码</text>
    </g>
    <g data-field="配置项" data-range="4">
      <rect x="460" y="68" width="112" height="68" class="field"/>
      <text x="516" y="93" class="offset">4</text>
      <text x="516" y="117" class="field-label">配置项</text>
    </g>
    <g data-field="索引" data-range="5">
      <rect x="572" y="68" width="88" height="68" class="field"/>
      <text x="616" y="93" class="offset">5</text>
      <text x="616" y="117" class="field-label">索引</text>
    </g>
    <g data-field="有效值长度" data-range="6">
      <rect x="660" y="68" width="140" height="68" class="field"/>
      <text x="730" y="93" class="offset">6</text>
      <text x="730" y="117" class="field-label">有效值长度</text>
    </g>
    <g data-field="值区（16 字节）" data-range="7–22">
      <rect x="800" y="68" width="252" height="68" class="field"/>
      <text x="926" y="93" class="offset">7–22</text>
      <text x="926" y="117" class="field-label">值区（16 字节）</text>
    </g>
  </g>
  <text x="40" y="167" class="note">字节 2 · 位 [7:3] 为请求序号，位 [2:0] 为应答操作码</text>
</svg>
