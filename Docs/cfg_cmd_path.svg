<svg xmlns="http://www.w3.org/2000/svg" width="1092" height="282" viewBox="0 0 1092 282" id="cfg_cmd_path-root" role="img" aria-labelledby="cent-cfg-path-title cent-cfg-path-desc">
  <title id="cent-cfg-path-title">配置命令处理流程</title>
  <desc id="cent-cfg-path-desc">管理 UDP 档收到请求后，cfg_cmd 检查帧格式。格式错误时丢弃请求且不应答。格式正确时，cfg_regs 校验并在通过后执行命令，cfg_cmd 封装处理结果并经管理 UDP 档返回。</desc>
  <defs>
    <marker id="cent-cfg-path-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#486079" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    #cfg_cmd_path-root text {
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", system-ui, sans-serif;
      font-weight: 400;
      fill: #152942;
    }
    #cfg_cmd_path-root .title { font-size: 28px; font-weight: 600; }
    #cfg_cmd_path-root .step { font-size: 20px; text-anchor: middle; }
    #cfg_cmd_path-root .detail { font-size: 16px; fill: #465b73; text-anchor: middle; }
    #cfg_cmd_path-root .branch { font-size: 15px; fill: #465b73; }
    #cfg_cmd_path-root .card { fill: #f3f6fa; stroke: #b8c7d6; }
    #cfg_cmd_path-root .check { fill: #e8f2fe; stroke: #9bb7d5; }
    #cfg_cmd_path-root .drop { fill: #fff2df; stroke: #bc955d; }
    #cfg_cmd_path-root .arrow { fill: none; stroke: #486079; stroke-width: 1.5; marker-end: url(#cent-cfg-path-arrow); }
  </style>

  <rect width="1092" height="282" fill="#ffffff"/>
  <text x="40" y="49" class="title">配置命令处理流程</text>

  <path d="M224 112 H258" class="arrow"/>
  <path d="M476 112 H546" class="arrow"/>
  <path d="M772 112 H816" class="arrow"/>
  <path d="M367 152 V203" class="arrow"/>
  <text x="511" y="101" class="branch" text-anchor="middle">格式正确</text>
  <text x="382" y="183" class="branch">格式错误</text>

  <rect x="40" y="76" width="180" height="72" rx="6" class="card"/>
  <text x="130" y="107" class="step">管理 UDP 档</text>
  <text x="130" y="130" class="detail">接收请求</text>

  <rect x="262" y="76" width="210" height="72" rx="6" class="check"/>
  <text x="367" y="107" class="step">固定帧检查</text>
  <text x="367" y="130" class="detail">22 字节 · 末拍 · 标识</text>

  <rect x="550" y="76" width="218" height="72" rx="6" class="card"/>
  <text x="659" y="107" class="step">配置寄存器</text>
  <text x="659" y="130" class="detail">校验通过后执行</text>

  <rect x="820" y="76" width="232" height="72" rx="6" class="card"/>
  <text x="936" y="107" class="step">封装应答</text>
  <text x="936" y="130" class="detail">经管理 UDP 档返回</text>

  <rect x="262" y="207" width="210" height="46" rx="6" class="drop"/>
  <text x="367" y="237" class="step">丢弃，不应答</text>
</svg>
