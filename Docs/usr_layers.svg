<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="d-diagram-design-title d-diagram-design-desc" id="d-diagram-design-root">
<title id="d-diagram-design-title">AXI-Stream 侧带位段与各接口位宽</title>
<desc id="d-diagram-design-desc">单通道 MAC、IP、ICMPv4 和 UDP 的 usr 位宽及位段，从左到右按高位到低位排列。</desc>
  <defs>
      <style>#d-diagram-design-root .diagram-container { max-width: 1120px; margin: 0 auto; overflow-x: auto; }
      #d-diagram-design-root text { fill: #152942; font-family: Geist, "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; font-weight: 400; }
      #d-diagram-design-root .heading { font-family: "Instrument Serif", "Songti SC", "Noto Serif CJK SC", "SimSun", Georgia, serif; font-size: 32px; }
      #d-diagram-design-root .section-name { font-size: 21px; font-weight: 600; }
      #d-diagram-design-root .interface, #d-diagram-design-root .field-name { font-size: 16px; }
      #d-diagram-design-root .width, #d-diagram-design-root .bits { fill: #465b73; font-size: 15px; }
      #d-diagram-design-root .bits { font-family: "Geist Mono", Consolas, "Liberation Mono", monospace; }
      #d-diagram-design-root .field { fill: #f3f6fa; stroke: #b8c7d6; }
      #d-diagram-design-root .shared { fill: #e1edf6; stroke: #7698b4; }
      @media print {
#d-diagram-design-root .diagram-container { overflow-x: visible; }
}</style>
  </defs>
<rect width="1120" height="640" fill="#ffffff"/>
<text x="32" y="48" text-anchor="start" class="heading">AXI-Stream 侧带位段与各接口位宽</text>
<text x="32" y="80" text-anchor="start" class="width">data 512 位  ·  keep 64 位  ·  valid / last / ready 各 1 位</text>
<path d="M32 100H1088" stroke="#8d9eb1"/>
<text x="32" y="136" text-anchor="start" class="section-name">基础接口</text>
<text x="32" y="168" text-anchor="start" class="interface">MAC RX</text>
<text x="240" y="168" text-anchor="end" class="width">1 位</text>
<g data-field="CMAC 坏帧标志" data-range="[0]">
<rect x="32" y="180" width="208" height="52" class="field"/>
<text x="136" y="199" text-anchor="middle" class="bits">[0]</text>
<text x="136" y="220" text-anchor="middle" class="field-name">CMAC 坏帧标志</text>
</g>
<text x="260" y="168" text-anchor="start" class="interface">IPv4 / IPv6 / ICMPv4 RX</text>
<text x="740" y="168" text-anchor="end" class="width">97 位</text>
