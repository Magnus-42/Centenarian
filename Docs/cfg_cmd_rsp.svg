<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 620" width="1260" height="620" role="img">
<title>配置命令 · 应答帧与合并顺序</title>
<desc>三种应答帧格式：SET_RSP(0x81) 与 ERR_RSP(0x8F) 为 6 字节不带 VALUE，GET_RSP(0x82) 带 VALUE；三路应答经 3 口轮询合并为单路输出，因此到达顺序与请求顺序无关。</desc>

<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="1260" height="620" fill="#FFFFFF"/>

<text x="26" y="38" font-family="Helvetica,Arial,sans-serif" font-size="21" font-weight="600" fill="#111111">配置命令 · 应答帧与合并顺序</text>
<text x="26" y="62" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#5F5E5A">三路应答各自成帧、单拍输出 ｜ 经 3 口轮询合并 ｜ 应答顺序 ≠ 请求顺序 ｜ 字段序统一，低字节在前</text>

<!-- ================= ① 三种应答帧 ================= -->
<rect x="14" y="84" width="1232" height="296" rx="12" fill="#FAFAF8" stroke="#D3D1C7" stroke-width="1"/>
<circle cx="46" cy="113" r="5" fill="#185FA5"/>
<text x="60" y="118" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#111111">三种应答帧</text>
<text x="1220" y="117" text-anchor="end" font-family="Consolas,Menlo,monospace" font-size="11.5" fill="#444441">OP → SEQ → STATUS → ITEM → {SET,PORT} → LEN → [VALUE]</text>

<!-- SET 应答 -->
<text x="40" y="148" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#111111">SET 成功应答  ·  OP = 0x81  ·  6 字节，不带 VALUE</text>
<rect x="40" y="156" width="140" height="44" rx="7" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
<text x="110" y="183" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="11.5" fill="#04342C">0x81</text>
<rect x="196" y="156" width="140" height="44" rx="7" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
<text x="266" y="183" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#04342C">SEQ</text>
<rect x="352" y="156" width="170" height="44" rx="7" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
<text x="437" y="183" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="11.5" fill="#04342C">STATUS=00</text>
<rect x="538" y="156" width="140" height="44" rx="7" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
<text x="608" y="183" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#04342C">ITEM</text>
<rect x="694" y="156" width="170" height="44" rx="7" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
<text x="779" y="183" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="11.5" fill="#04342C">{SET, PORT}</text>
<rect x="880" y="156" width="140" height="44" rx="7" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
<text x="950" y="183" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#04342C">LEN</text>
<text x="1036" y="183" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#5F5E5A">回显请求的 LEN，不含值</text>

<!-- GET 应答 -->
<text x="40" y="228" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#111111">GET 成功应答  ·  OP = 0x82  ·  6 字节 + VALUE（LEN 由 ITEM 决定）</text>
<rect x="40" y="236" width="140" height="44" rx="7" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
<text x="110" y="263" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="11.5" fill="#042C53">0x82</text>
<rect x="196" y="236" width="140" height="44" rx="7" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
<text x="266" y="263" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#042C53">SEQ</text>
<rect x="352" y="236" width="170" height="44" rx="7" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
<text x="437" y="263" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="11.5" fill="#042C53">STATUS=00</text>
<rect x="538" y="236" width="140" height="44" rx="7" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
<text x="608" y="263" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#042C53">ITEM</text>
<rect x="694" y="236" width="170" height="44" rx="7" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
<text x="779" y="263" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="11.5" fill="#042C53">{SET, PORT}</text>
<rect x="880" y="236" width="140" height="44" rx="7" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
<text x="950" y="263" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#042C53">LEN</text>
<rect x="1036" y="236" width="184" height="44" rx="7" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
<text x="1128" y="263" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#042C53">VALUE（小端）</text>

<!-- ERR 应答 -->
<text x="40" y="308" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#111111">错误应答  ·  OP = 0x8F  ·  6 字节，STATUS 为错误码（0x01 ~ 0x07）</text>
<rect x="40" y="316" width="140" height="44" rx="7" fill="#FBEAF0" stroke="#993556" stroke-width="1.2"/>
<text x="110" y="343" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="11.5" fill="#4B1528">0x8F</text>
<rect x="196" y="316" width="140" height="44" rx="7" fill="#FBEAF0" stroke="#993556" stroke-width="1.2"/>
<text x="266" y="343" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#4B1528">SEQ</text>
<rect x="352" y="316" width="170" height="44" rx="7" fill="#FBEAF0" stroke="#993556" stroke-width="1.2"/>
<text x="437" y="343" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="11.5" fill="#4B1528">STATUS≠0</text>
<rect x="538" y="316" width="140" height="44" rx="7" fill="#FBEAF0" stroke="#993556" stroke-width="1.2"/>
<text x="608" y="343" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#4B1528">ITEM</text>
<rect x="694" y="316" width="170" height="44" rx="7" fill="#FBEAF0" stroke="#993556" stroke-width="1.2"/>
<text x="779" y="343" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="11.5" fill="#4B1528">{SET, PORT}</text>
<rect x="880" y="316" width="140" height="44" rx="7" fill="#FBEAF0" stroke="#993556" stroke-width="1.2"/>
<text x="950" y="343" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#4B1528">LEN</text>
<text x="1036" y="343" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#5F5E5A">回显请求值，不含值</text>

<!-- ================= ② 合并与匹配 ================= -->
<rect x="14" y="396" width="1232" height="200" rx="12" fill="#FAFAF8" stroke="#D3D1C7" stroke-width="1"/>
<circle cx="46" cy="425" r="5" fill="#534AB7"/>
<text x="60" y="430" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#111111">三路合并与应答匹配</text>
<text x="1220" y="429" text-anchor="end" font-family="Consolas,Menlo,monospace" font-size="11.5" fill="#444441">axis_n_to_1  ·  3 口轮询  ·  单路输出</text>

<rect x="40" y="444" width="190" height="42" rx="7" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
<text x="135" y="470" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="11.5" fill="#04342C">cfg_set</text>
<rect x="40" y="492" width="190" height="42" rx="7" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
<text x="135" y="518" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="11.5" fill="#042C53">cfg_get</text>
<rect x="40" y="540" width="190" height="42" rx="7" fill="#FBEAF0" stroke="#993556" stroke-width="1.2"/>
<text x="135" y="566" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="11.5" fill="#4B1528">cfg_error</text>

<path d="M230 465 H286" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M230 513 H286" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M230 561 H286" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ar)"/>

<rect x="292" y="482" width="170" height="62" rx="7" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
<text x="377" y="507" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#26215C">axis_n_to_1</text>
<text x="377" y="526" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#5F5E5A">3 口轮询</text>

<path d="M462 513 H512" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="518" y="486" width="200" height="54" rx="7" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
<text x="618" y="509" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="11.5" fill="#26215C">m_axis_* (512b)</text>
<text x="618" y="528" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#5F5E5A">→ UDP TX 命令档</text>

<text x="756" y="466" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#111111">为什么顺序不能依赖</text>
<text x="756" y="488" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#5F5E5A">轮询仲裁不保证请求先到先回：一帧内多根 TLV、或多帧连续下发时，</text>
<text x="756" y="508" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#5F5E5A">应答可能交错到达。上位机必须按 (SEQ, ITEM, SET, PORT) 四元组匹配，</text>
<text x="756" y="528" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#5F5E5A">不要依赖收包顺序；同一帧内请让每根 TLV 带不同 SEQ 以便区分。</text>
<text x="756" y="554" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#5F5E5A">应答回到请求帧的源 IP / 源端口，因此必须用同一 socket 收发。</text>
</svg>
