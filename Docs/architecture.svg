<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="666" viewBox="0 0 1120 666" role="img" aria-labelledby="cent-architecture-title cent-architecture-desc">
  <title id="cent-architecture-title">Centenarian 单口硬件框图</title>
  <desc id="cent-architecture-desc">QSFP 与 CMAC 经跨 SLR 和异步 FIFO 接入 eth_stack_port。MAC 层按 EtherType 选择直通业务、ARP、IPv4 或 IPv6。IPv4 接入 ICMPv4，IPv4 和 IPv6 各接一路 UDP。</desc>
  <defs>
    <marker id="cent-architecture-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#486079" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <style>
    text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", system-ui, sans-serif; fill: #152942; }
    .title { font-size: 32px; font-weight: 700; }
    .section { font-size: 22px; font-weight: 700; }
    .label { font-size: 19px; }
    .small { font-size: 17px; fill: #486079; }
    .detail { font-size: 15px; fill: #486079; }
    .code { font: 17px Consolas, "SFMono-Regular", "Microsoft YaHei", "Noto Sans Mono CJK SC", monospace; fill: #486079; }
    .strong { font-weight: 700; fill: #152942; }
    .signal { font: 15px Consolas, "SFMono-Regular", "Microsoft YaHei", monospace; fill: #486079; }
  </style>
  <rect x="0" y="0" width="1120" height="666" rx="0" fill="#ffffff" stroke="none"/>
  <rect x="40" y="30" width="36" height="4" rx="0" fill="#185fa5" stroke="none"/>
  <text x="40" y="70" class="title" text-anchor="start">Centenarian 单口硬件框图</text>
  <text x="40" y="102" class="small" text-anchor="start">eth_stack_port · A/B 口各一份 · 业务 AXI-Stream 为 512 bit/拍</text>
  <rect x="466" y="122" width="622" height="464" rx="8" fill="#f2f6f9" stroke="#adbfce"/>
  <text x="484" y="148" class="small strong" text-anchor="start">业务时钟域 clk</text>
  <path d="M200 386 H244" fill="none" stroke="#486079" stroke-width="1.8" stroke-linejoin="round" marker-start="url(#cent-architecture-arrow)" marker-end="url(#cent-architecture-arrow)"/>
  <path d="M432 386 H482" fill="none" stroke="#486079" stroke-width="1.8" stroke-linejoin="round" marker-start="url(#cent-architecture-arrow)" marker-end="url(#cent-architecture-arrow)"/>
  <path d="M660 220 H692 Q700 220 700 212 V193 Q700 185 708 185 H728" fill="none" stroke="#486079" stroke-width="1.8" stroke-linejoin="round" marker-start="url(#cent-architecture-arrow)" marker-end="url(#cent-architecture-arrow)"/>
  <path d="M660 286 H728" fill="none" stroke="#486079" stroke-width="1.8" stroke-linejoin="round" marker-start="url(#cent-architecture-arrow)" marker-end="url(#cent-architecture-arrow)"/>
  <path d="M660 386 H728" fill="none" stroke="#486079" stroke-width="1.8" stroke-linejoin="round" marker-start="url(#cent-architecture-arrow)" marker-end="url(#cent-architecture-arrow)"/>
  <path d="M660 528 H728" fill="none" stroke="#486079" stroke-width="1.8" stroke-linejoin="round" marker-start="url(#cent-architecture-arrow)" marker-end="url(#cent-architecture-arrow)"/>
  <path d="M804 350 V322" fill="none" stroke="#185fa5" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#cent-architecture-arrow)"/>
  <path d="M880 370 H895 Q903 370 903 362 V350 Q903 342 911 342 H930" fill="none" stroke="#486079" stroke-width="1.8" stroke-linejoin="round" marker-start="url(#cent-architecture-arrow)" marker-end="url(#cent-architecture-arrow)"/>
  <path d="M880 404 H895 Q903 404 903 412 V442 Q903 450 911 450 H930" fill="none" stroke="#486079" stroke-width="1.8" stroke-linejoin="round" marker-start="url(#cent-architecture-arrow)" marker-end="url(#cent-architecture-arrow)"/>
  <path d="M880 528 H930" fill="none" stroke="#486079" stroke-width="1.8" stroke-linejoin="round" marker-start="url(#cent-architecture-arrow)" marker-end="url(#cent-architecture-arrow)"/>
  <rect x="40" y="350" width="160" height="72" rx="8" fill="#ffffff" stroke="#adbfce"/>
<text x="120" y="381" class="label strong" text-anchor="middle">QSFP / CMAC</text>
<text x="120" y="407" class="small" text-anchor="middle">100GbE · 4 lanes</text>
  <rect x="244" y="350" width="188" height="72" rx="8" fill="#ffffff" stroke="#adbfce"/>
<text x="338" y="381" class="label strong" text-anchor="middle">SLR / CDC</text>
<text x="338" y="407" class="small" text-anchor="middle">RX/TX 异步 FIFO</text>
  <rect x="482" y="176" width="178" height="384" rx="8" fill="#eaf2fb" stroke="#185fa5"/>
<text x="571" y="363" class="label strong" text-anchor="middle">Ethernet</text>
<text x="571" y="389" class="small" text-anchor="middle">分流 / 发送仲裁</text>
  <rect x="728" y="152" width="152" height="66" rx="8" fill="#ffffff" stroke="#adbfce"/>
<text x="804" y="180" class="label strong" text-anchor="middle">MAC 业务</text>
<text x="804" y="206" class="small" text-anchor="middle">用户 EtherType</text>
  <rect x="728" y="250" width="152" height="72" rx="8" fill="#ffffff" stroke="#adbfce"/>
<text x="804" y="281" class="label strong" text-anchor="middle">ARP 引擎</text>
<text x="804" y="307" class="small" text-anchor="middle">学习与地址解析</text>
  <rect x="728" y="350" width="152" height="72" rx="8" fill="#ffffff" stroke="#adbfce"/>
<text x="804" y="381" class="label strong" text-anchor="middle">IPv4</text>
<text x="804" y="407" class="small" text-anchor="middle">Protocol 分流</text>
  <rect x="728" y="492" width="152" height="72" rx="8" fill="#ffffff" stroke="#adbfce"/>
<text x="804" y="523" class="label strong" text-anchor="middle">IPv6</text>
<text x="804" y="549" class="small" text-anchor="middle">Next Header 分流</text>
  <rect x="930" y="306" width="142" height="72" rx="8" fill="#ffffff" stroke="#adbfce"/>
<text x="1001" y="337" class="label strong" text-anchor="middle">ICMPv4</text>
<text x="1001" y="363" class="small" text-anchor="middle">业务 / 回显</text>
  <rect x="930" y="414" width="142" height="72" rx="8" fill="#e9f5f0" stroke="#0f6e56"/>
<text x="1001" y="445" class="label strong" text-anchor="middle">UDP</text>
<text x="1001" y="471" class="small" text-anchor="middle">业务 / 管理</text>
  <rect x="930" y="492" width="142" height="72" rx="8" fill="#e9f5f0" stroke="#0f6e56"/>
<text x="1001" y="523" class="label strong" text-anchor="middle">UDP</text>
<text x="1001" y="549" class="small" text-anchor="middle">业务</text>
  <text x="694" y="273" class="signal" text-anchor="middle">0806</text>
  <text x="694" y="373" class="signal" text-anchor="middle">0800</text>
  <text x="694" y="515" class="signal" text-anchor="middle">86DD</text>
  <text x="815" y="341" class="detail" text-anchor="start">查询</text>
  <text x="40" y="619" class="small" text-anchor="start">双箭头表示收发数据通路，虚线表示 IPv4 发送侧的 ARP 地址查询。</text>
</svg>
